{% extends "base.html" %}

{% block title %}Posts{% endblock %}

{% block content %}
    <ul>
        {% for post in posts %}
            <li>
                <a href="{% url 'blog:post_detail' post.slug %}">{{ post.title }}</a>
            </li>
        {% empty %}
            <li>No posts yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
