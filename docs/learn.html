              "<code>python manage.py migrate</code> — actually runs that migration against the real database file."
            ]},
            {"h": "Where to see it", "p": "<code>backend/apps/shop/migrations/0003_order_orderitem.py</code> is the generated file from adding the Order/OrderItem models — a permanent, checked-in record of exactly how the schema evolved."}
          ]
        },
        {
          "id": "the-orm",
          "title": "The ORM — Python instead of SQL",
          "lede": "ORM stands for Object-Relational Mapper: it lets you query the database by calling Python methods, and it translates those calls into SQL behind the scenes.",
          "repo": {
            "head": "backend/apps/blog/views.py",
            "code": "def get_queryset(self):\n    return Post.objects.filter(published=True)"
          },
          "blocks": [
            {"h": "Reading it", "p": "<code>Post.objects</code> is the \"manager\" for the Post table — your entry point for querying it. <code>.filter(published=True)</code> builds (and, once used, runs) something equivalent to <code>SELECT * FROM blog_post WHERE published = true</code>, without a single line of SQL written by hand."},
            {"h": "Why this is worth learning well", "p": "Almost every bug and performance question later in this project (like the N+1 query problem) is really a question about what SQL a chain of <code>.filter()</code>/<code>.select_related()</code> calls actually produces."}
          ]
        },
        {
          "id": "admin-site",
          "title": "The admin site — a free CRUD UI",
          "lede": "Django ships a full working web interface for creating, viewing, editing, and deleting your data — generated automatically from your models, no template written by hand.",
          "repo": {
            "head": "backend/apps/shop/admin.py",
            "code": "@admin.register(Product)\nclass ProductAdmin(admin.ModelAdmin):\n    list_display = (\"name\", \"category\", \"price\", \"stock\", \"active\")\n    list_filter = (\"category\", \"active\")"
          },
          "blocks": [
            {"h": "What this three-line class buys you", "p": "A whole page at <code>/admin/shop/product/</code> listing every product in a sortable table, filterable by category and active status, with working add/edit/delete forms — built from the <code>Product</code> model's own fields. <code>list_display</code>/<code>list_filter</code> only customize which columns show; the CRUD behavior itself is entirely free."}
          ],
          "tryIt": "Run the dev server and visit /admin/ once you've created a superuser (`python manage.py createsuperuser`) — click into Products and just look around."
        },
        {
          "id": "urls",
          "title": "URLs — routing a web address to code",
          "lede": "A URLconf is a list of patterns Django checks, top to bottom, to decide which code should handle an incoming request.",
          "repo": {
            "head": "backend/apps/blog/urls.py",
            "code": "urlpatterns = [\n    path(\"\", views.PostListView.as_view(), name=\"post_list\"),\n    path(\"<slug:slug>/\", views.PostDetailView.as_view(), name=\"post_detail\"),\n]"
          },
          "blocks": [
            {"h": "Reading it", "p": "A request for <code>/blog/</code> matches the first pattern and runs <code>PostListView</code>. A request for <code>/blog/my-first-post/</code> matches the second — <code>&lt;slug:slug&gt;</code> captures whatever's in that spot in the URL and hands it to the view as <code>slug=\"my-first-post\"</code>."},
            {"h": "The two-level structure", "p": "<code>backend/config/urls.py</code> is the top-level map (\"anything starting with <code>blog/</code> goes to <code>apps.blog.urls</code>\"); each app then has its own <code>urls.py</code> for just its own patterns. This keeps blog's URLs from needing to know shop exists."}
          ]
        },
        {
          "id": "views",
          "title": "Views — the code that actually runs",
          "lede": "A view is the function or class that a URL points to — it decides what data to fetch and what to send back as the response.",
          "repo": {
            "head": "backend/apps/blog/views.py",
            "code": "class PostDetailView(DetailView):\n    model = Post\n    template_name = \"blog/post_detail.html\"\n    slug_url_kwarg = \"slug\""
          },
          "blocks": [
            {"h": "What happens when this view runs", "p": "Django already knows how to fetch \"the one Post whose slug matches the URL\" because this is a <code>DetailView</code> — a Django-provided class built exactly for \"show one object.\" This view only has to say <em>which</em> model and <em>which</em> template; the fetch-one-object logic is inherited."}
          ]
        },
        {
          "id": "templates",
          "title": "Templates — HTML with blanks to fill in",
          "lede": "A template is an HTML file with placeholders that get filled in with real data when a view renders it.",
          "blocks": [
            {"h": "The idea", "p": "Somewhere in <code>blog/post_detail.html</code>, <code>{{ post.title }}</code> is a placeholder. When <code>PostDetailView</code> renders that template, it hands over the actual <code>Post</code> object as <code>post</code>, and Django substitutes <code>{{ post.title }}</code> with that post's real title before sending the HTML to the browser."},
            {"h": "The split this enforces", "p": "The view decides <em>what</em> data is relevant; the template decides <em>how</em> it looks on the page. Mixing those two concerns into one file is exactly what this separation avoids."}
          ]
        },
        {
          "id": "cbv-mixins",
          "title": "Class-based views and mixins",
          "lede": "Instead of writing every view from scratch, you can build one out of several parent classes — each contributing one specific rule.",
          "repo": {
            "head": "backend/apps/blog/views.py",
            "code": "class PostUpdateView(LoginRequiredMixin, UserPassesTestMixin, UpdateView):\n    def test_func(self):\n        return self.get_object().author == self.request.user"
          },
          "blocks": [
            {"h": "Reading the three parents", "list": [
              "<code>LoginRequiredMixin</code> — redirects anonymous visitors to the login page before anything else runs.",
              "<code>UserPassesTestMixin</code> — blocks the request unless <code>test_func()</code> returns True; here, unless you're the post's author.",
              "<code>UpdateView</code> — supplies the actual \"show a form, save the changes\" behavior."
            ]},
            {"h": "Why this is worth noticing", "p": "None of that logic was written by hand in this class — each rule was inherited from a parent, and this class only fills in the one detail (<code>test_func</code>) that's actually unique to it."}
          ]
        },
        {
          "id": "forms",
          "title": "Forms — validating what a user submits",
          "lede": "A form is Django's tool for taking raw submitted data, checking it's valid, and turning it into clean Python values (or a saved object).",
          "blocks": [
            {"h": "Where it shows up", "p": "<code>PostCreateView</code> uses <code>fields = [\"title\", \"slug\", \"body\", \"published\", \"tags\"]</code> — Django builds the form automatically from those model fields, including the right input type for each (a checkbox for the boolean <code>published</code>, a text box for <code>title</code>) and validates them (e.g. a slug must be URL-safe) before anything touches the database."}
          ]
        },
        {
          "id": "auth-sessions",
          "title": "Users, login, and sessions",
          "lede": "A session is how Django remembers \"this browser is logged in as this user\" across multiple separate requests, using a cookie.",
          "blocks": [
            {"h": "The flow", "list": [
              "You submit a login form; Django checks the password.",
              "On success, Django creates a session and sends the browser a cookie identifying it.",
              "Every later request from that browser includes the cookie, so Django knows <code>request.user</code> without asking you to log in again."
            ]},
            {"h": "Where it's used", "p": "<code>LoginRequiredMixin</code> from the previous lesson is checking exactly this — is there a valid session cookie identifying a logged-in user."}
          ],
          "related": "auth-flow-preview"
        }
      ]
    },
    {
      "label": "Part 3 · Building an API for a frontend",
      "lessons": [
        {
          "id": "what-is-rest",
          "title": "What's an API, what's REST",
          "lede": "So far, views return whole HTML pages. An API instead returns raw data — usually as JSON — so any frontend (a React app, a mobile app) can read it and render its own UI.",
          "blocks": [
            {"h": "REST, briefly", "p": "REST is just a common convention for shaping that data-only API around resources and HTTP methods: <code>GET /api/posts/</code> lists posts, <code>POST /api/posts/</code> creates one, <code>GET /api/posts/3/</code> fetches post 3, <code>PUT</code>/<code>PATCH</code> edit it, <code>DELETE</code> removes it — the URL names the thing, the HTTP method names the action."},
            {"h": "In this repo", "p": "Django REST Framework (DRF) is the library that adds this API layer on top of Django, living alongside the older template-based blog views from Part 2 — both serve the same underlying <code>Post</code> model."}
          ]
        },
        {
          "id": "serializers",
          "title": "Serializers — translating models to and from JSON",
          "lede": "A serializer is DRF's version of a form: it converts a Django model object into JSON to send out, and validates incoming JSON before turning it back into a model object.",
          "repo": {
            "head": "backend/apps/blog/serializers.py",
            "code": "class PostSerializer(serializers.ModelSerializer):\n    author = serializers.ReadOnlyField(source=\"author.username\")\n\n    class Meta:\n        model = Post\n        fields = [\"id\", \"title\", \"slug\", \"body\", \"author\", \"published\", \"tags\"]"
          },
          "blocks": [
            {"h": "Reading it", "p": "<code>ModelSerializer</code> looks at the <code>Post</code> model and figures out most of the field types itself. <code>author</code> is overridden to show the username as plain read-only text instead of a raw database ID — a small, explicit customization on top of what's inferred automatically."}
          ]
        },
        {
          "id": "viewsets-routers",
          "title": "ViewSets and routers",
          "lede": "A ViewSet bundles up the list/create/retrieve/update/delete logic for one model into a single class; a router then generates all the matching URLs automatically.",
          "repo": {
            "head": "backend/apps/blog/api_urls.py",
            "code": "router = DefaultRouter()\nrouter.register(\"posts\", PostViewSet, basename=\"post\")\nurlpatterns = router.urls"
          },
          "blocks": [
            {"h": "What those two lines generate", "p": "<code>GET/POST /api/posts/</code> and <code>GET/PUT/PATCH/DELETE /api/posts/&lt;id&gt;/</code> — the full set of REST URLs for posts, without writing a single <code>path(...)</code> line by hand the way Part 2's <code>urls.py</code> required."}
          ]
        },
        {
          "id": "permissions",
          "title": "Permissions — who can do what",
          "lede": "A permission class answers a yes/no question before a view runs: is this specific request allowed?",
          "repo": {
            "head": "backend/apps/blog/api.py",
            "code": "class PostViewSet(viewsets.ModelViewSet):\n    permission_classes = [permissions.IsAuthenticatedOrReadOnly, IsAuthorOrReadOnly]"
          },
          "blocks": [
            {"h": "Two checks stacked together", "p": "<code>IsAuthenticatedOrReadOnly</code> answers \"can you write anything here at all\" (anonymous users get read-only access). <code>IsAuthorOrReadOnly</code> is a small custom class answering a narrower question: \"is this post yours to edit,\" by comparing <code>obj.author</code> to <code>request.user</code>. Both must pass."}
          ]
        },
        {
          "id": "jwt",
          "title": "Tokens (JWT) — auth without cookies",
          "lede": "A separately-hosted frontend (this project's React app runs on its own dev server) can't rely on Django's session cookie the same way a template-rendered page can. JWT is a different way to prove who's logged in.",
          "blocks": [
            {"h": "How it works here", "list": [
              "React sends username/password to <code>/api/token/</code>.",
              "Django sends back an access token — a signed, tamper-proof string that encodes \"this is user X, valid until this time.\"",
              "React stores it and attaches it to every later API request as an <code>Authorization: Bearer &lt;token&gt;</code> header instead of relying on a cookie."
            ]},
            {"h": "Why both auth systems exist side by side", "p": "Session auth still runs the Django admin and the signup page from Part 2; JWT is only for the React app. DRF is configured to accept either one — see <code>DEFAULT_AUTHENTICATION_CLASSES</code> in <code>config/settings.py</code>."}
          ]
        }
      ]
    },
    {
      "label": "Part 4 · The shop app: relationships & integrity",
      "lessons": [
        {
          "id": "relationships",
          "title": "Modeling relationships: ForeignKey, ManyToMany, OneToOne",
          "lede": "Real data isn't flat — a Product belongs to a Category, an Order has many OrderItems, a Cart belongs to exactly one user. Django has one field type for each shape of relationship.",
          "blocks": [
            {"h": "The three shapes, with real examples", "list": [
              "<strong>ForeignKey</strong> (many-to-one) — <code>Product.category = models.ForeignKey(Category, ...)</code>: many products, one category each.",
              "<strong>ManyToManyField</strong> — <code>Post.tags = models.ManyToManyField(Tag, ...)</code>: a post can have many tags, and a tag can label many posts.",
              "<strong>OneToOneField</strong> — <code>Cart.user = models.OneToOneField(settings.AUTH_USER_MODEL, ...)</code>: exactly one cart per user, no more."
            ]},
            {"h": "Why the field type matters, not just the name", "p": "Each of these creates a different actual structure in the database (a foreign-key column, versus a whole separate join table for many-to-many). Picking the right one is picking the right shape for the real-world relationship, not just a naming choice."}
          ]
        },
        {
          "id": "service-layer-lesson",
          "title": "Why checkout logic lives in its own file",
          "lede": "<code>apps/shop/services.py</code> holds plain functions like <code>add_to_cart</code> and <code>checkout</code> — not methods on the <code>Cart</code> model, and not code inside a view.",
          "blocks": [
            {"h": "The reasoning", "p": "A rule like \"checkout must fail entirely if any item is out of stock\" isn't really about the database (the model's job) or about HTTP (the view's job) — it's business logic, a third thing. Writing it as a plain function makes it trivially testable on its own, and reusable later from a Celery background task without duplicating it."}
          ]
        },
        {
          "id": "transactions",
          "title": "Database transactions — all or nothing",
          "lede": "A transaction groups several database writes so they either <em>all</em> succeed together, or, if anything fails partway, they all get undone as if none had happened.",
          "repo": {
            "head": "backend/apps/shop/services.py",
            "code": "@transaction.atomic\ndef checkout(cart):\n    ...\n    order = Order.objects.create(user=cart.user, total=Decimal(\"0\"))\n    for item in items:\n        OrderItem.objects.create(order=order, ...)\n        item.product.stock -= item.quantity\n        item.product.save()\n    ..."
          },
          "blocks": [
            {"h": "Why this matters here specifically", "p": "Checkout makes several separate writes: create the order, create each order item, decrement stock for each product, clear the cart. Without <code>@transaction.atomic</code>, a crash halfway through could leave an order with only half its items, or stock decremented but no order recorded at all. The decorator guarantees it's all-or-nothing."}
          ]
        },
        {
          "id": "signals",
          "title": "Signals — code that reacts automatically",
          "lede": "A signal lets one piece of code announce \"something just happened,\" and other, completely separate code react to it — without the first piece knowing the second exists.",
          "repo": {
            "head": "backend/apps/shop/signals.py",
            "code": "@receiver(post_save, sender=Order)\ndef send_order_confirmation(sender, instance, created, **kwargs):\n    if created:\n        logger.info(\"Order confirmation email queued for order #%s\", instance.pk)"
          },
          "blocks": [
            {"h": "Reading it", "p": "<code>post_save</code> fires every time <em>any</em> Order is saved. This function only reacts <code>if created</code> — the first time, not on every later update. <code>checkout()</code> never imports or calls this function directly; Django wires it up automatically because it's registered with <code>@receiver</code>."},
            {"h": "Why it's just a log line for now", "p": "It's a deliberate placeholder — the exact seam a later lesson (Celery, for real background email sending) will plug into, without needing to touch <code>checkout()</code> at all."}
          ]
        }
      ]
    },
    {
      "label": "Part 5 · What's coming next",
      "lessons": [
        {
          "id": "whats-next",
          "title": "A preview of what's still ahead",
          "lede": "These aren't built yet — they're the concepts the next stages of this project will introduce, so the names won't be a surprise when they show up.",
          "blocks": [
            {"h": "Celery — background tasks", "p": "Right now the order-confirmation signal only logs a line. Celery lets that turn into a real task (like sending an email) that runs in the background, without making the person checking out wait for it."},
            {"h": "Caching", "p": "Storing the result of an expensive query so the next request can skip re-running it — with the tricky part being knowing exactly when to throw that stored result away."},
            {"h": "Rate limiting", "p": "Capping how many requests one person can make in a given time window — protecting a login page from being guessed at, or a checkout endpoint from being hammered."}
          ]
        }
      ]
    }
  ]
}
</script>

<script>
(function () {
  const data = JSON.parse(document.getElementById("content-data").textContent);
  const nav = document.getElementById("nav");
  const reader = document.getElementById("reader");
  const STORAGE_KEY = "djangoPlaygroundLessons";

  function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  const flat = [];
  data.parts.forEach(part => part.lessons.forEach(l => flat.push(Object.assign({ part: part.label }, l))));

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { done: [], last: null }; }
    catch (e) { return { done: [], last: null }; }
  }
  function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
  let progress = loadProgress();

  function renderBlock(b) {
    let html = "<div class=\"block\">";
    if (b.h) html += "<h3>" + esc(b.h) + "</h3>";
    if (b.p) html += "<p>" + b.p + "</p>";
    if (b.list) html += "<ul>" + b.list.map(li => "<li>" + li + "</li>").join("") + "</ul>";
    html += "</div>";
    return html;
  }

  function renderLesson(l, idx) {
    let html = "";
    html += "<div class=\"kicker\">" + esc(l.part) + " · Lesson " + (idx + 1) + " of " + flat.length + "</div>";
    html += "<h2>" + esc(l.title) + "</h2>";
    html += "<p class=\"lede\">" + l.lede + "</p>";
    if (l.repo) {
      html += "<div class=\"repo-panel\"><div class=\"repo-head\">" + esc(l.repo.head) + "</div><pre class=\"code\">" + esc(l.repo.code) + "</pre></div>";
    }
    (l.blocks || []).forEach(b => { html += renderBlock(b); });
    if (l.tryIt) {
      html += "<div class=\"tryit\"><span class=\"tag\">Try it</span><p>" + esc(l.tryIt) + "</p></div>";
    }
    html += "<div class=\"navfoot\">";
    if (idx > 0) {
      html += "<button class=\"navbtn\" data-nav=\"prev\"><span><span class=\"lbl\">Previous</span><span class=\"ttl\">" + esc(flat[idx - 1].title) + "</span></span></button>";
    } else {
      html += "<span></span>";
    }
    if (idx < flat.length - 1) {
      html += "<button class=\"navbtn primary\" data-nav=\"next\"><span><span class=\"lbl\">Next</span><span class=\"ttl\">" + esc(flat[idx + 1].title) + "</span></span></button>";
    } else {
      html += "<button class=\"navbtn primary\" disabled><span><span class=\"lbl\">You're at</span><span class=\"ttl\">the last lesson</span></span></button>";
    }
    html += "</div>";
    return html;
  }

  data.parts.forEach(part => {
    const group = document.createElement("div");
    group.className = "navgroup";
    const h3 = document.createElement("h3");
    h3.textContent = part.label;
    group.appendChild(h3);
    part.lessons.forEach(l => {
      const idx = flat.findIndex(f => f.id === l.id);
      const btn = document.createElement("button");
      btn.className = "navlink";
      btn.dataset.target = l.id;
      btn.innerHTML = "<span class=\"num\">" + (idx + 1) + "</span><span>" + esc(l.title) + "</span>";
      group.appendChild(btn);
    });
    nav.appendChild(group);
  });

  flat.forEach((l, idx) => {
    const section = document.createElement("section");
    section.className = "lesson";
    section.id = "lesson-" + l.id;
    section.innerHTML = renderLesson(l, idx);
    reader.appendChild(section);
  });

  function updateProgressBar() {
    const total = flat.length;
    const done = progress.done.length;
    document.getElementById("progressfill").style.width = (total ? (done / total * 100) : 0) + "%";
    document.getElementById("progresslabel").textContent = done + " / " + total + " done";
  }

  function refreshNavState(currentId) {
    document.querySelectorAll(".navlink").forEach(btn => {
      const isDone = progress.done.includes(btn.dataset.target);
      btn.classList.toggle("done", isDone);
      btn.toggleAttribute("aria-current", btn.dataset.target === currentId);
      if (btn.dataset.target === currentId) btn.setAttribute("aria-current", "true");
      else btn.removeAttribute("aria-current");
      const numSpan = btn.querySelector(".num");
      numSpan.textContent = isDone ? "" : String(flat.findIndex(f => f.id === btn.dataset.target) + 1);
    });
  }

  function activate(id) {
    const idx = flat.findIndex(f => f.id === id);
    if (idx === -1) return;
    document.querySelectorAll(".lesson").forEach(s => s.classList.remove("active"));
    document.getElementById("lesson-" + id).classList.add("active");
    reader.scrollTop = 0;
    progress.last = id;
    saveProgress(progress);
    refreshNavState(id);
    history.replaceState(null, "", "#" + id);
  }

  function markDone(id) {
    if (!progress.done.includes(id)) {
      progress.done.push(id);
      saveProgress(progress);
      updateProgressBar();
    }
  }

  nav.addEventListener("click", e => {
    const btn = e.target.closest(".navlink");
    if (btn) activate(btn.dataset.target);
  });

  reader.addEventListener("click", e => {
    const navBtn = e.target.closest("[data-nav]");
    if (!navBtn) return;
    const current = document.querySelector(".lesson.active").id.replace("lesson-", "");
    const idx = flat.findIndex(f => f.id === current);
    if (navBtn.dataset.nav === "next" && idx < flat.length - 1) {
      markDone(current);
      activate(flat[idx + 1].id);
    } else if (navBtn.dataset.nav === "prev" && idx > 0) {
      activate(flat[idx - 1].id);
    }
  });

  document.getElementById("resetbtn").addEventListener("click", () => {
    progress = { done: [], last: flat[0].id };
    saveProgress(progress);
    updateProgressBar();
    activate(flat[0].id);
  });

  const initial = location.hash.replace("#", "");
  const startId = flat.find(f => f.id === initial) ? initial : (progress.last && flat.find(f => f.id === progress.last) ? progress.last : flat[0].id);
  updateProgressBar();
  activate(startId);
})();
</script>
