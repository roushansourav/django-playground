          "lede": "A serializer is DRF's version of a form: it converts a Django model object into JSON to send out, and validates incoming JSON before turning it back into a model object.",
          "repos": [
            {
              "path": "backend/apps/blog/serializers.py",
              "start": 21,
              "rows": [
                {"code": "class PostSerializer(serializers.ModelSerializer):", "note": "Inherits from <code>ModelSerializer</code>, which looks at the <code>Post</code> model and infers most field types automatically — this class only needs to override or add what it can't infer."},
                {"code": "    author = serializers.ReadOnlyField(source=\"author.username\")", "note": "Overrides the automatic guess for <code>author</code> (which would default to a raw numeric ID) to show the username as plain read-only text instead."},
                {"code": "    tags = serializers.SlugRelatedField(", "note": "Overrides <code>tags</code> too — by default a many-to-many field would serialize as a list of numeric IDs; this field's opening line switches that representation instead."},
                {"code": "        many=True, slug_field=\"slug\", queryset=Tag.objects.all(), required=False", "note": "<code>many=True</code> because a post can have several tags; <code>slug_field=\"slug\"</code> means each tag appears as its slug text (e.g. <code>\"django\"</code>) rather than its ID; <code>required=False</code> means a post can be saved with no tags at all."},
                {"code": "    )"}
              ]
            }
          ],
          "blocks": [
            {"h": "Why this looks like the forms lesson", "p": "It's the same idea, aimed at JSON instead of HTML: take raw input, validate it, produce (or consume) a model instance."}
          ]
        },
        {
          "id": "viewsets-routers",
          "title": "ViewSets and routers",
          "lede": "A ViewSet bundles up the list/create/retrieve/update/delete logic for one model into a single class; a router then generates all the matching URLs automatically.",
          "repos": [
            {
              "path": "backend/apps/blog/api_urls.py",
              "start": 5,
              "rows": [
                {"code": "router = DefaultRouter()", "note": "Creates a router — an object that knows how to generate a full set of REST URLs for any model it's told about."},
                {"code": "router.register(\"posts\", PostViewSet, basename=\"post\")", "note": "Registers <code>PostViewSet</code> under the <code>posts</code> prefix — this one line generates <code>GET/POST /api/posts/</code> and <code>GET/PUT/PATCH/DELETE /api/posts/&lt;id&gt;/</code>, without writing a single <code>path(...)</code> by hand."},
                {"code": "router.register(\"comments\", CommentViewSet, basename=\"comment\")", "note": "Same pattern, for comments."},
                {"code": "router.register(\"tags\", TagViewSet, basename=\"tag\")"},
                {"code": ""},
                {"code": "urlpatterns = router.urls", "note": "The router builds its generated list of <code>path(...)</code> entries here — the same role as the hand-written <code>urlpatterns</code> list in the urls lesson, just generated instead of typed."}

        {
          "id": "permissions",
          "title": "Permissions — who can do what",
          "lede": "A permission class answers a yes/no question before a view runs: is this specific request allowed?",
          "repos": [
            {
              "path": "backend/apps/blog/api.py",
              "start": 13,
              "rows": [
                {"code": "class PostViewSet(viewsets.ModelViewSet):", "note": "Inherits list/create/retrieve/update/delete behavior for the <code>Post</code> model all at once — see the viewsets-routers lesson."},
                {"code": "    queryset = Post.objects.filter(published=True)", "note": "Which rows this ViewSet operates on — only published posts."},
                {"code": "    serializer_class = PostSerializer", "note": "Which serializer converts these objects to and from JSON — see the serializers lesson."},
                {"code": "    permission_classes = [permissions.IsAuthenticatedOrReadOnly, IsAuthorOrReadOnly]", "note": "Two permission checks stacked together — both must pass. <code>IsAuthenticatedOrReadOnly</code> answers \"can you write anything here at all\"; <code>IsAuthorOrReadOnly</code>, defined in this same app, is shown below."}
              ]
            },
            {
              "path": "backend/apps/blog/permissions.py",
              "start": 4,
              "rows": [
                {"code": "class IsAuthorOrReadOnly(permissions.BasePermission):", "note": "A custom permission class, inheriting from DRF's base permission class so it slots into <code>permission_classes</code> lists like the one above."},
                {"code": "    def has_object_permission(self, request, view, obj):", "note": "DRF calls this automatically for actions on one specific object (like editing post #3), passing that object in as <code>obj</code>."},
                {"code": "        if request.method in permissions.SAFE_METHODS:", "note": "\"Safe\" methods are the read-only ones — <code>GET</code>, <code>HEAD</code>, <code>OPTIONS</code>."},
                {"code": "            return True", "note": "Anyone can read, so a safe method always passes."},
                {"code": "        return obj.author == request.user", "note": "For a write method (<code>POST</code>, <code>PUT</code>, <code>DELETE</code>), it only passes if the object's own <code>author</code> matches whoever's making the request."}

        {
          "id": "jwt",
          "title": "Tokens (JWT) — auth without cookies",
          "lede": "A separately-hosted frontend (this project's React app runs on its own dev server) can't rely on Django's session cookie the same way a template-rendered page can. JWT is a different way to prove who's logged in.",
          "repos": [
            {
              "path": "backend/config/urls.py",
              "start": 26,
              "rows": [
                {"code": "    path('api/token/', TokenObtainPairView.as_view(), name='token_obtain_pair'),", "note": "Posting a username/password here returns a signed access token — this is what the React frontend calls to log in."},
                {"code": "    path('api/token/refresh/', TokenRefreshView.as_view(), name='token_refresh'),", "note": "Access tokens expire; posting a valid refresh token here returns a new access token without asking for the password again."}
              ]
            },
            {
              "path": "backend/config/settings.py",
              "start": 137,
              "rows": [
                {"code": "    \"DEFAULT_AUTHENTICATION_CLASSES\": [", "note": "Lists, in order, every way DRF will try to identify who's making a request."},
                {"code": "        \"rest_framework.authentication.SessionAuthentication\",", "note": "Checks for a Django session cookie — what the template-based admin and blog pages from Part 2 use."},
                {"code": "        \"rest_framework_simplejwt.authentication.JWTAuthentication\",", "note": "Checks for an <code>Authorization: Bearer &lt;token&gt;</code> header instead — what the separately-hosted React app uses. Both are tried, so either kind of client works against the same API."},
                {"code": "    ],"}
              ]
            }
          ],
          "blocks": [
            {"h": "How it works, end to end", "list": [
              "React sends username/password to <code>/api/token/</code>.",
              "Django sends back an access token — a signed, tamper-proof string encoding \"this is user X, valid until this time.\"",
              "React stores it and attaches it to every later API request as an <code>Authorization: Bearer &lt;token&gt;</code> header instead of relying on a cookie."
            ]}
          ]

    {
      "label": "Part 4 · The shop app: relationships & integrity",
      "lessons": [

          "id": "relationships",
          "title": "Modeling relationships: ForeignKey, ManyToMany, OneToOne",
          "lede": "Real data isn't flat — a Product belongs to a Category, an Order has many OrderItems, a Cart belongs to exactly one user. Django has one field type for each shape of relationship.",
          "repos": [
            {
              "path": "backend/apps/shop/models.py",
              "start": 23,
              "rows": [

              ]
            },

              "path": "backend/apps/shop/models.py",
              "start": 34,
              "rows": [
                {"code": "    user = models.OneToOneField(", "note": "<strong>OneToOneField</strong> — exactly one <code>Cart</code> per user, no more, enforced by the database itself (it's a ForeignKey with a uniqueness constraint added)."},
                {"code": "        settings.AUTH_USER_MODEL, on_delete=models.CASCADE, related_name=\"cart\"", "note": "Points at whichever model <code>AUTH_USER_MODEL</code> names (the custom <code>User</code> from the inheritance lesson) rather than hardcoding a specific class — the standard, swap-safe way to reference the user model."},
                {"code": "    )"}
              ]
            }
          ],
          "blocks": [
            {"h": "Why the field type matters, not just the name", "p": "Each of these creates a different actual structure in the database (a foreign-key column, versus a whole separate join table for many-to-many). Picking the right one is picking the right shape for the real-world relationship, not just a naming choice."}
          ]
        },
        {
          "id": "service-layer-lesson",
          "title": "Why checkout logic lives in its own file",
          "lede": "<code>apps/shop/services.py</code> holds plain functions like <code>add_to_cart</code> and <code>checkout</code> — not methods on the <code>Cart</code> model, and not code inside a view.",
          "repos": [
            {"path": "backend/apps/shop/services.py"}
          ],
          "blocks": [
            {"h": "The reasoning", "p": "A rule like \"checkout must fail entirely if any item is out of stock\" isn't really about the database (the model's job) or about HTTP (the view's job) — it's business logic, a third thing. Writing it as plain functions in this file (annotated fully in the transactions lesson next) makes it trivially testable on its own, and reusable later from a Celery background task without duplicating it."}
          ]
        },
        {
          "id": "transactions",
          "title": "Database transactions — all or nothing",
          "lede": "A transaction groups several database writes so they either <em>all</em> succeed together, or, if anything fails partway, they all get undone as if none had happened.",
          "repos": [
            {
              "path": "backend/apps/shop/services.py",
              "start": 32,
              "rows": [
                {"code": "@transaction.atomic", "note": "Wraps everything below in one database transaction — see the decorators lesson."},
                {"code": "def checkout(cart):", "note": "Takes one cart and either fully succeeds or fully fails — nothing in between."},
                {"code": "    items = list(cart.items.select_related(\"product\"))", "note": "Fetches this cart's items once, up front, as an actual list — <code>select_related(\"product\")</code> loads each item's linked Product in the same query instead of one extra query per item (see the-orm lesson)."},
                {"code": "    if not items:", "note": "Guards against checking out an empty cart."},
                {"code": "        raise ValueError(\"Cart is empty\")", "note": "A plain built-in exception is enough here, since this isn't a business rule worth a custom exception type."},
                {"code": ""},
                {"code": "    for item in items:", "note": "First pass over every item — checking, not writing anything yet."},
                {"code": "        if item.quantity > item.product.stock:", "note": "Checks whether this item wants more units than the product currently has in stock."},
                {"code": "            raise InsufficientStockError(f\"Not enough stock for {item.product.name}\")", "note": "Raised before any database write below runs — a doomed checkout never partially writes anything (see exceptions lesson)."},
                {"code": ""},
                {"code": "    order = Order.objects.create(user=cart.user, total=Decimal(\"0\"))", "note": "Only reached if every item passed the stock check. Creates the Order row with a placeholder total, to be filled in once the real total is known."},
                {"code": "    total = Decimal(\"0\")", "note": "A running total, accumulated as each item is processed below."},
                {"code": "    for item in items:", "note": "Second pass over the same items — this time to actually write."},
                {"code": "        OrderItem.objects.create(", "note": "Creates one OrderItem row per cart item; the constructor's arguments continue on the next four lines."},
                {"code": "            order=order,", "note": "Which order this item belongs to."},
                {"code": "            product=item.product,", "note": "Which product, copied from the cart item."},
                {"code": "            quantity=item.quantity,", "note": "How many units, copied from the cart item."},
                {"code": "            unit_price=item.product.price,", "note": "The product's price at this exact moment — recorded here so a later price change never retroactively alters an old order."},
                {"code": "        )"},
                {"code": "        item.product.stock -= item.quantity", "note": "Decrements the product's stock in memory by however many were bought."},
                {"code": "        item.product.save()", "note": "Writes that decremented stock back to the database — without this line, the subtraction above would be lost."},
                {"code": "        total += item.subtotal", "note": "Adds this item's subtotal (price × quantity, from the self lesson) onto the running total."},
                {"code": ""},
                {"code": "    order.total = total", "note": "Now that the real total is known, assigns it onto the order object in memory."},
                {"code": "    order.save()", "note": "Writes that total to the database — the update that makes <code>order.total</code> correct."},
                {"code": "    cart.items.all().delete()", "note": "Empties the cart now that its contents have become a real order."},
                {"code": "    return order", "note": "Hands the finished Order back to whoever called <code>checkout</code>."}
              ]
            }
          ],
          "blocks": [
            {"h": "Why this matters here specifically", "p": "Checkout makes several separate writes: create the order, create each order item, decrement stock, clear the cart. Without <code>@transaction.atomic</code>, a crash halfway through could leave an order with only half its items, or stock decremented but no order recorded at all. The decorator guarantees it's all-or-nothing."}
          ]
        },
        {
          "id": "signals",
          "title": "Signals — code that reacts automatically",
          "lede": "A signal lets one piece of code announce \"something just happened,\" and other, completely separate code react to it — without the first piece knowing the second exists.",
          "repos": [
            {
              "path": "backend/apps/shop/signals.py",
              "start": 1,
              "rows": [
                {"code": "import logging", "note": "Python's standard logging module — used below instead of <code>print()</code>."},
                {"code": ""},
                {"code": "from django.db.models.signals import post_save", "note": "Imports the specific signal this file listens for — <code>post_save</code> fires every time any model instance is saved."},
                {"code": "from django.dispatch import receiver", "note": "Imports the <code>@receiver</code> decorator, used below to register the function as a listener."},
                {"code": ""},
                {"code": "from apps.shop.models import Order", "note": "This file only cares about saves on this one model."},
                {"code": ""},
                {"code": "logger = logging.getLogger(__name__)", "note": "Creates a logger named after this file's module path, following Python's standard logging convention."},
                {"code": ""},
                {"code": ""},
                {"code": "@receiver(post_save, sender=Order)", "note": "Registers the function below to run automatically whenever an <code>Order</code> is saved — <code>sender=Order</code> means only Order saves trigger it, not saves of any other model."},
                {"code": "def send_order_confirmation(sender, instance, created, **kwargs):", "note": "Django calls this with standard arguments: <code>sender</code> (the model class), <code>instance</code> (the specific Order just saved), and <code>created</code> (True only on the very first save, not a later update)."},
                {"code": "    if created:", "note": "Only reacts the first time an Order appears — not on every later edit to an existing order."},
                {"code": "        logger.info(", "note": "Logs an informational message; the message string and its two <code>%s</code> placeholders continue on the next lines."},
                {"code": "            \"Order confirmation email queued for order #%s (%s)\","},
                {"code": "            instance.pk,", "note": "The new order's primary key, filled into the first <code>%s</code>."},
                {"code": "            instance.user.email,", "note": "The buyer's email, filled into the second <code>%s</code>."},
                {"code": "        )", "note": "<code>checkout()</code> in <code>services.py</code> never imports or calls this function directly — Django wires it up automatically because it's registered with <code>@receiver</code>."}
              ]
            }
          ],
          "blocks": [
            {"h": "Why it's just a log line for now", "p": "It's a deliberate placeholder — the exact seam a later lesson (Celery, for real background email sending) will plug into, without needing to touch <code>checkout()</code> at all."}
          ]
        }
      ]
    },
    {
      "label": "Part 5 · What's coming next",
      "lessons": [
        {
          "id": "whats-next",
          "title": "A preview of what's still ahead",
          "lede": "These aren't built yet — they're the concepts the next stages of this project will introduce, so the names won't be a surprise when they show up.",
          "blocks": [
            {"h": "Celery — background tasks", "p": "Right now the order-confirmation signal only logs a line. Celery lets that turn into a real task (like sending an email) that runs in the background, without making the person checking out wait for it."},
            {"h": "Caching", "p": "Storing the result of an expensive query so the next request can skip re-running it — with the tricky part being knowing exactly when to throw that stored result away."},
            {"h": "Rate limiting", "p": "Capping how many requests one person can make in a given time window — protecting a login page from being guessed at, or a checkout endpoint from being hammered."}
          ]
        }
      ]
    }
  ]
}
</script>

<script>
(function () {
  const data = JSON.parse(document.getElementById("content-data").textContent);
  const nav = document.getElementById("nav");
  const reader = document.getElementById("reader");
  const STORAGE_KEY = "djangoPlaygroundLessons";
  const GH_BASE = "https://github.com/roushansourav/django-playground/blob/main/";

  function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  const flat = [];
  data.parts.forEach(part => part.lessons.forEach(l => flat.push(Object.assign({ part: part.label }, l))));

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { done: [], last: null }; }
    catch (e) { return { done: [], last: null }; }
  }
  function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
  let progress = loadProgress();

  function renderBlock(b) {
    let html = "<div class=\"block\">";
    if (b.h) html += "<h3>" + esc(b.h) + "</h3>";
    if (b.p) html += "<p>" + b.p + "</p>";
    if (b.list) html += "<ul>" + b.list.map(li => "<li>" + li + "</li>").join("") + "</ul>";
    html += "</div>";
    return html;
  }

  function repoUrl(r) {
    if (!r.start || !r.rows || !r.rows.length) return GH_BASE + r.path;
    const end = r.start + r.rows.length - 1;
    return GH_BASE + r.path + "#L" + r.start + (end > r.start ? "-L" + end : "");
  }

  function renderRepo(r) {
    let html = "<div class=\"repo-panel\"><div class=\"repo-head\"><span class=\"path\">" + esc(r.path) + "</span>";
    html += "<a class=\"gh-link\" href=\"" + repoUrl(r) + "\" target=\"_blank\" rel=\"noopener\">View on GitHub ↗</a></div>";
    if (r.rows && r.rows.length) {
      html += "<div class=\"code-annotated\">";
      r.rows.forEach((row, i) => {
        const ln = r.start + i;
        html += "<div class=\"row\"><div class=\"codeline\"><span class=\"ln\">" + ln + "</span><code class=\"src\">" + esc(row.code) + "</code></div>";
        if (row.note) html += "<div class=\"note\">" + row.note + "</div>";
        html += "</div>";
      });
      html += "</div>";
    }
    html += "</div>";
    return html;
  }

  function renderLesson(l, idx) {
    let html = "";
    html += "<div class=\"kicker\">" + esc(l.part) + " · Lesson " + (idx + 1) + " of " + flat.length + "</div>";
    html += "<h2>" + esc(l.title) + "</h2>";
    html += "<p class=\"lede\">" + l.lede + "</p>";
    (l.repos || []).forEach(r => { html += renderRepo(r); });
    (l.blocks || []).forEach(b => { html += renderBlock(b); });
    if (l.tryIt) {
      html += "<div class=\"tryit\"><span class=\"tag\">Try it</span><p>" + esc(l.tryIt) + "</p></div>";
    }
    html += "<div class=\"navfoot\">";
    if (idx > 0) {
      html += "<button class=\"navbtn\" data-nav=\"prev\"><span><span class=\"lbl\">Previous</span><span class=\"ttl\">" + esc(flat[idx - 1].title) + "</span></span></button>";
    } else {
      html += "<span></span>";
    }
    if (idx < flat.length - 1) {
      html += "<button class=\"navbtn primary\" data-nav=\"next\"><span><span class=\"lbl\">Next</span><span class=\"ttl\">" + esc(flat[idx + 1].title) + "</span></span></button>";
    } else {
      html += "<button class=\"navbtn primary\" disabled><span><span class=\"lbl\">You're at</span><span class=\"ttl\">the last lesson</span></span></button>";
    }
    html += "</div>";
    return html;
  }

  data.parts.forEach(part => {
    const group = document.createElement("div");
    group.className = "navgroup";
    const h3 = document.createElement("h3");
    h3.textContent = part.label;
    group.appendChild(h3);
    part.lessons.forEach(l => {
      const idx = flat.findIndex(f => f.id === l.id);
      const btn = document.createElement("button");
      btn.className = "navlink";
      btn.dataset.target = l.id;
      btn.innerHTML = "<span class=\"num\">" + (idx + 1) + "</span><span>" + esc(l.title) + "</span>";
      group.appendChild(btn);
    });
    nav.appendChild(group);
  });

  flat.forEach((l, idx) => {
    const section = document.createElement("section");
    section.className = "lesson";
    section.id = "lesson-" + l.id;
    section.innerHTML = renderLesson(l, idx);
    reader.appendChild(section);
  });

  function updateProgressBar() {
    const total = flat.length;
    const done = progress.done.length;
    document.getElementById("progressfill").style.width = (total ? (done / total * 100) : 0) + "%";
    document.getElementById("progresslabel").textContent = done + " / " + total + " done";
  }

  function refreshNavState(currentId) {
    document.querySelectorAll(".navlink").forEach(btn => {
      const isDone = progress.done.includes(btn.dataset.target);
      btn.classList.toggle("done", isDone);
      btn.toggleAttribute("aria-current", btn.dataset.target === currentId);
      if (btn.dataset.target === currentId) btn.setAttribute("aria-current", "true");
      else btn.removeAttribute("aria-current");
      const numSpan = btn.querySelector(".num");
      numSpan.textContent = isDone ? "" : String(flat.findIndex(f => f.id === btn.dataset.target) + 1);
    });
  }

  function activate(id) {
    const idx = flat.findIndex(f => f.id === id);
    if (idx === -1) return;
    document.querySelectorAll(".lesson").forEach(s => s.classList.remove("active"));
    document.getElementById("lesson-" + id).classList.add("active");
    reader.scrollTop = 0;
    progress.last = id;
    saveProgress(progress);
    refreshNavState(id);
    history.replaceState(null, "", "#" + id);
  }

  function markDone(id) {
    if (!progress.done.includes(id)) {
      progress.done.push(id);
      saveProgress(progress);
      updateProgressBar();
    }
  }

  nav.addEventListener("click", e => {
    const btn = e.target.closest(".navlink");
    if (btn) activate(btn.dataset.target);
  });

  reader.addEventListener("click", e => {
    const navBtn = e.target.closest("[data-nav]");
    if (!navBtn) return;
    const current = document.querySelector(".lesson.active").id.replace("lesson-", "");
    const idx = flat.findIndex(f => f.id === current);
    if (navBtn.dataset.nav === "next" && idx < flat.length - 1) {
      markDone(current);
      activate(flat[idx + 1].id);
    } else if (navBtn.dataset.nav === "prev" && idx > 0) {
      activate(flat[idx - 1].id);
    }
  });

  document.getElementById("resetbtn").addEventListener("click", () => {
    progress = { done: [], last: flat[0].id };
    saveProgress(progress);
    updateProgressBar();
    activate(flat[0].id);
  });

  const initial = location.hash.replace("#", "");
  const startId = flat.find(f => f.id === initial) ? initial : (progress.last && flat.find(f => f.id === progress.last) ? progress.last : flat[0].id);
  updateProgressBar();
  activate(startId);
})();
</script>
