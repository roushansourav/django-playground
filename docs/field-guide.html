          "status": "live",

          "blocks": [
            {"h": "The normalized shape", "p": "<code>Product</code> stores price once. <code>CartItem</code> stores a quantity plus FKs to <code>Cart</code> and <code>Product</code> — never a copy of the product's name or price. <code>CartItem.subtotal</code> is computed on read (<code>product.price * quantity</code>) instead of stored, so there's exactly one place a price can ever be wrong."},

          "blocks": [
            {"h": "The concept", "p": "Rate limiting caps how many requests a client (by IP, by user, by API key) can make in a window of time, protecting against brute-force login attempts and against a buggy or malicious client hammering an expensive endpoint like checkout."},
            {"h": "How DRF does it", "p": "<code>rest_framework.throttling</code> ships <code>AnonRateThrottle</code> and <code>UserRateThrottle</code>, configured with a rate string like <code>\"5/min\"</code> in <code>REST_FRAMEWORK[\"DEFAULT_THROTTLE_RATES\"]</code> — the same settings-driven pattern already used for <code>DEFAULT_PAGINATION_CLASS</code>. A common variant is a token-bucket algorithm: each client accrues “tokens” over time and spends one per request, allowing short bursts while still capping sustained rate."},

<script>
(function () {
  const data = JSON.parse(document.getElementById("content-data").textContent);
  const nav = document.getElementById("nav");
  const reader = document.getElementById("reader");

  function esc(s) {
    return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  }

  function renderBlock(b) {
    let html = "<div class=\"block\">";
    if (b.h) html += "<h3>" + esc(b.h) + "</h3>";
    if (b.where) html += "<p class=\"where\">" + b.where.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</p>";
    if (b.p) html += "<p>" + b.p + "</p>";
    if (b.list) {
      html += "<ul>" + b.list.map(li => "<li>" + li + "</li>").join("") + "</ul>";
    }
    html += "</div>";
    return html;
  }

  function renderTopic(t) {
    const badges = [
      t.status === "planned"
        ? "<span class=\"badge planned\">planned" + (t.planNote ? " — " + esc(t.planNote) : "") + "</span>"
        : "<span class=\"badge\">live in repo</span>"
    ].join("");

    let html = "";
    html += "<div class=\"kicker\">" + esc(t.kicker || "") + "</div>";
    html += "<h2>" + esc(t.title) + "</h2>";
    html += "<div class=\"badges\">" + badges + "</div>";
    html += "<p class=\"lede\">" + t.lede + "</p>";
    if (t.mermaid) {
      html += "<div class=\"block\"><pre class=\"mermaid\">" + t.mermaid + "</pre></div>";
    }
    (t.blocks || []).forEach(b => { html += renderBlock(b); });
    if (t.code) {
      html += "<div class=\"block\"><pre class=\"code\">" + esc(t.code) + "</pre></div>";
    }
    if (t.related && t.related.length) {
      html += "<div class=\"block\"><h3>Related</h3><div class=\"related\">" +
        t.related.map(id => "<button class=\"chip\" data-jump=\"" + id + "\">" + esc(findTitle(id)) + "</button>").join("") +
        "</div></div>";
    }
    return html;
  }

  const byId = {};
  data.groups.forEach(g => g.topics.forEach(t => { byId[t.id] = t; }));
  function findTitle(id) { return byId[id] ? byId[id].title : id; }

  // build nav
  data.groups.forEach(g => {
    const group = document.createElement("div");
    group.className = "navgroup";
    group.dataset.group = g.id;
    const h3 = document.createElement("h3");
    h3.textContent = g.label;
    group.appendChild(h3);
    g.topics.forEach(t => {
      const btn = document.createElement("button");
      btn.className = "navlink" + (t.status === "planned" ? " is-planned" : "");
      btn.dataset.target = t.id;
      btn.dataset.kw = (t.title + " " + (t.kw || "")).toLowerCase();
      btn.innerHTML = "<span class=\"dot\"></span><span>" + esc(t.title) + "</span>";
      group.appendChild(btn);
    });
    nav.appendChild(group);
  });

  // build reader panels
  data.groups.forEach(g => g.topics.forEach(t => {
    const section = document.createElement("section");
    section.className = "topic";
    section.id = "topic-" + t.id;
    section.innerHTML = renderTopic(t);
    reader.appendChild(section);
  }));

  function activate(id, updateHash) {
    document.querySelectorAll(".navlink").forEach(b => b.removeAttribute("aria-current"));
    document.querySelectorAll(".topic").forEach(s => s.classList.remove("active"));
    const btn = nav.querySelector('.navlink[data-target="' + id + '"]');
    const panel = document.getElementById("topic-" + id);
    if (!btn || !panel) return;
    btn.setAttribute("aria-current", "true");
    panel.classList.add("active");
    reader.scrollTop = 0;
    if (updateHash !== false) history.replaceState(null, "", "#" + id);
  }

  nav.addEventListener("click", e => {
    const btn = e.target.closest(".navlink");
    if (btn) activate(btn.dataset.target);
  });

  reader.addEventListener("click", e => {
    const jump = e.target.closest("[data-jump]");
    if (jump) {
      e.preventDefault();
      activate(jump.dataset.jump);
    }
  });

  document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".navgroup").forEach(group => {
      let anyVisible = false;
      group.querySelectorAll(".navlink").forEach(btn => {
        const match = !q || btn.dataset.kw.includes(q);
        btn.classList.toggle("hidden-by-search", !match);
        if (match) anyVisible = true;
      });
      group.classList.toggle("hidden-by-search", !anyVisible);
    });
  });

  const initial = location.hash.replace("#", "");
  activate(byId[initial] ? initial : data.groups[0].topics[0].id, false);
})();
</script>
